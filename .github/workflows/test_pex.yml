name: Test PEX rules with gfpex

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-pex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install gfpex (private, needs GFPEX_TOKEN)
        env:
          GFPEX_TOKEN: ${{ secrets.GFPEX_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GFPEX_TOKEN}@github.com/".insteadOf "https://github.com/"
          uv venv --python 3.12
          uv sync --extra dev
          uv pip install networkx "kfnetlist @ git+https://github.com/gdsfactory/kfnetlist" \
            "gfpex @ git+https://github.com/doplaydo/gf-pex@dev/diogo-main"
      - name: Run PEX tests
        # --no-sync: a plain `uv run` re-syncs the lockfile's kfnetlist, which lacks the morphnet module gfpex needs
        run: uv run --no-sync pytest tests/gfpex/ -v
