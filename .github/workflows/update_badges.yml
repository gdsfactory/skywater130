name: Update Badges
on:
  workflow_run:
    workflows: [Test code]
    types: [completed]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  badges:
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: read
    uses: doplaydo/pdk-ci-workflow-public/.github/workflows/update_badges.yml@main
    secrets:
      GFP_API_KEY: ${{ secrets.GFP_API_KEY }}
