name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: 'Version to cut, e.g. 1.2.3 or v1.2.3 — creates release/<version> with the bump commit, opens a PR, then tags, builds, and publishes'

jobs:
  cut-release:
    permissions:
      contents: write
      pull-requests: write
      checks: read
    uses: doplaydo/pdk-ci-workflow/.github/workflows/cut-release.yml@main
    with:
      version: ${{ inputs.version }}
    secrets:
      GFP_API_KEY: ${{ secrets.GFP_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # A PAT is required here: the branch/PR that cut-release creates must
      # trigger "Test code", and events created with github.token don't
      # trigger workflows.
      PDK_CI_WORKFLOW_TOKEN: ${{ secrets.PDK_CI_WORKFLOW_TOKEN }}

  release:
    needs: [cut-release]
    if: needs.cut-release.result == 'success' && needs.cut-release.outputs.skip_all != 'true'
    permissions:
      contents: write
      pull-requests: write
      checks: read
    uses: doplaydo/pdk-ci-workflow/.github/workflows/release.yml@main
    with:
      checkout_ref: ${{ needs.cut-release.outputs.head_sha }}
      head_branch: ${{ needs.cut-release.outputs.head_branch }}
    secrets:
      DEVPI_USERNAME: ${{ secrets.DEVPI_USERNAME }}
      DEVPI_PASSWORD: ${{ secrets.DEVPI_PASSWORD }}
      PYPI_USERNAME: ${{ secrets.PYPI_USERNAME }}
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      GFP_API_KEY: ${{ secrets.GFP_API_KEY }}
      SIMCLOUD_APIKEY: ${{ secrets.SIMCLOUD_APIKEY }}
      PDK_CI_WORKFLOW_TOKEN: ${{ secrets.PDK_CI_WORKFLOW_TOKEN }}
