name: Sample projects · released PDK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*--sample-projects/**'

permissions:
  contents: read

jobs:
  released:
    uses: doplaydo/pdk-ci-workflow-public/.github/workflows/sample-projects.yml@main
    with:
      pdk_source: released
    secrets:
      GFP_API_KEY: ${{ secrets.GFP_API_KEY }}
